name: tg-ghost
version: 1.0.0
description: "Telegram Bot API 10.0 Guest Chat Mode for Hermes Agent: a telegram_ghost gateway platform that answers guest queries through an inline message, with Telethon userbot history windowing, pagination and media tools, untrusted-content isolation."
author: "NousResearch / Community"
kind: standalone
requires_hermes: ">=0.21"
python_dependencies:
  - "telethon>=1.36"
tags:
  - telegram
  - guest-mode
  - bot-api
  - userbot
requires_env:
  - name: TELEGRAM_USERBOT_API_ID
    description: "MTProto api_id of the userbot account (https://my.telegram.org)"
    prompt: "Userbot api_id"
    password: false
  - name: TELEGRAM_USERBOT_API_HASH
    description: "MTProto api_hash of the userbot account"
    prompt: "Userbot api_hash"
    password: true
provides_tools:
  - ghost_history
  - ghost_messages
  - ghost_media
  - ghost_reset
config_schema:
  api_id:
    type: secret
    env: TELEGRAM_USERBOT_API_ID
    label: "Userbot api_id"
    description: "MTProto api_id аккаунта юзербота (https://my.telegram.org). Гейтвей подхватит после перезапуска."
  api_hash:
    type: secret
    env: TELEGRAM_USERBOT_API_HASH
    label: "Userbot api_hash"
    description: "MTProto api_hash аккаунта юзербота. Гейтвей подхватит после перезапуска."
  userbot_enabled:
    type: bool
    default: true
    label: "Окно истории через юзербота"
    description: "Прикладывать к каждому запросу сообщения чата, прочитанные юзерботом."
  initial_history_window:
    type: int
    default: 10
    label: "Размер окна истории"
    description: "Сколько сообщений вокруг целевого прикладывать к запросу."
  max_history_limit:
    type: int
    default: 200
    label: "Бюджет истории на сессию"
    description: "Сколько сообщений агент может догрузить через ghost_history и ghost_messages за одну сессию."
  session_ttl_minutes:
    type: int
    default: 20
    label: "TTL сессии, минут"
    description: "После стольких минут тишины в чате следующий запрос начинает новую сессию (0 — никогда)."
  placeholder_text:
    type: str
    default: "⏳ Думаю..."
    label: "Текст заглушки"
    description: "Показывается, пока готовится ответ."
  toolsets:
    type: list
    default: []
    label: "Фильтр инструментов"
    description: "Пусто — те же инструменты, что в личке с ботом. Список тулсетов (например [tg-ghost, web, vision]) — только они, остальное блокируется."
